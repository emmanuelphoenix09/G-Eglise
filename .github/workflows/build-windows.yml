name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - windows-exe-rebuild
    paths:
      - 'index.html'
      - 'electron/**'
      - 'package.json'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build installer
        run: npm run dist
      - name: Upload installer (3 days)
        uses: actions/upload-artifact@v4
        with:
          name: G-Eglise-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 3
