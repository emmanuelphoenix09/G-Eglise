name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova & Build APK
        run: |
          npm install -g cordova
          cordova create app com.geglise.app "GEglise"
          cd app
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          cordova platform add android
          cordova build android --no-telemetry

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: G-Eglise-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
