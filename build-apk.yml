name: Construire APK G-Eglise

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Générer l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm install

      - name: Construire les fichiers Web
        run: npm run build

      - name: Vérifier les fichiers Web
        run: |
          echo "Contenu du dossier www :"
          ls -lah www
          test -f www/index.html
          echo "Taille de index.html :"
          wc -c www/index.html

      - name: Installer Capacitor Android
        run: npx cap add android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Préparer Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Vérifier l'APK
        run: |
          echo "Recherche de l'APK..."
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: G-Eglise-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
